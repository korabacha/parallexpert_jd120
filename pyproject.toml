[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "korabacha-parallexpert_jd120"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对预训练并行策略专家·注意力核��的访存瓶颈相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "korabacha" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://korabacha.github.io"
Repository = "https://github.com/korabacha/parallexpert_jd120"
Issues = "https://github.com/korabacha/parallexpert_jd120/issues"

[project.scripts]
parallexpert_jd120 = "parallexpert_jd120:main"

[tool.setuptools]
py-modules = ["parallexpert_jd120"]
